
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📸 Photo Gallery</h1>
    <nav>
        <ul>
            <li><a href="#" onclick="showSection('home')">Home</a></li>
            <li><a href="#" onclick="showSection('gallery')">Gallery</a></li>
        </ul>
    </nav>
</header>

<main>

    <!-- HOME -->
    <section id="home" class="active">
        <h2>Welcome</h2>
        <p>Upload and manage your photos easily.</p>

        <!-- Multiple upload -->
        <input type="file" id="upload" multiple>
    </section>

    <!-- GALLERY -->
    <section id="gallery-section">
        <h2>Your Gallery</h2>
        <div id="gallery" class="gallery-container"></div>
    </section>

</main>

<footer>
    <p>&copy; 2026 Photo Gallery App</p>
</footer>

<script src="app.js"></script>

</body>
</html>
